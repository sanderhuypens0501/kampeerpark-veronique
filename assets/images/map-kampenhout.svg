<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#f4f6f0; font-family:'Inter', sans-serif;">
  <defs>
    <!-- Patterns and filters -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="parkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="mapShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Base / Green Countryside -->
  <rect width="960" height="540" fill="#f8fafc"/>
  
  <!-- Soft Natural Green Patches / Nature areas -->
  <path d="M 0,0 L 400,0 C 450,80 350,140 280,180 C 180,240 100,200 0,300 Z" fill="#ecfdf5" opacity="0.8"/>
  <path d="M 550,0 C 650,40 750,20 960,60 L 960,0 Z" fill="#f0fdf4" opacity="0.9"/>
  <path d="M 450,260 C 580,280 700,210 820,290 C 890,340 960,320 960,450 L 960,540 L 400,540 C 350,480 380,380 450,260 Z" fill="#f0fdf4" opacity="0.7"/>

  <!-- Nature reserves / green zones near Kampenhout -->
  <!-- Torfbroek / Kastanjebos nature reserves indication -->
  <rect x="80" y="320" width="160" height="120" rx="20" fill="url(#parkGrad)" opacity="0.6"/>
  <text x="160" y="385" font-size="12" fill="#166534" font-weight="600" text-anchor="middle">Natuurgebied Torfbroek</text>

  <!-- Major Roads (soft grey / sand) -->
  <!-- N21 Haachtsesteenweg -->
  <path d="M 50,490 Q 320,380 620,240 T 940,90" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
  <path d="M 50,490 Q 320,380 620,240 T 940,90" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <text x="750" y="160" font-size="11" fill="#64748b" font-weight="500" transform="rotate(-22, 750, 160)">N21 Haachtsesteenweg (Mechelen ➔ Leuven)</text>

  <!-- N26 Mechelsesteenweg -->
  <path d="M 220,30 L 220,520" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <text x="232" y="90" font-size="11" fill="#64748b" font-weight="500">N26 (naar Mechelen 12km)</text>

  <!-- Kanaal Leuven-Dijle (De Vaart) - Dominant scenic water artery -->
  <path id="canalPath" d="M 120,540 C 260,420 380,340 480,260 C 570,180 720,120 920,40" fill="none" stroke="#bae6fd" stroke-width="26" stroke-linecap="round"/>
  <path d="M 120,540 C 260,420 380,340 480,260 C 570,180 720,120 920,40" fill="none" stroke="url(#waterGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- Jaagpad Fietsroute langs het kanaal (LF / F24 / Knooppunten) -->
  <path d="M 135,535 C 275,415 395,335 495,255 C 585,175 735,115 935,35" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="710" y="80" font-size="11" fill="#15803d" font-weight="600" transform="rotate(-23, 710, 80)">🚴 Jaagpad Fietsroute (Leuven ⇄ Mechelen)</text>

  <!-- Sas van Kampenhout (Historic lock) -->
  <g transform="translate(480, 260)">
    <circle cx="0" cy="0" r="16" fill="#0284c7" opacity="0.2"/>
    <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#0369a1"/>
    <rect x="-3" y="-12" width="6" height="24" rx="2" fill="#0c4a6e"/>
    <!-- Sas label -->
    <rect x="-85" y="-42" width="170" height="26" rx="6" fill="#ffffff" filter="url(#mapShadow)"/>
    <text x="0" y="-25" font-size="12" fill="#0369a1" font-weight="700" text-anchor="middle">⚓ Sas van Kampenhout</text>
  </g>

  <!-- Local Street: Vaartstraat -->
  <path d="M 450,290 Q 510,310 590,320 T 700,310" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <text x="560" y="340" font-size="11" fill="#92400e" font-weight="600">Vaartstraat</text>

  <!-- Campsite Area Highlight -->
  <g transform="translate(560, 265)">
    <!-- Campsite Boundary Area -->
    <path d="M -30,-20 L 70,-10 L 80,45 L -20,40 Z" fill="#166534" fill-opacity="0.15" stroke="#166534" stroke-width="2" stroke-dasharray="4,2"/>
    
    <!-- Mini tents & trees in park area -->
    <path d="M 0,10 L 8,-5 L 16,10 Z" fill="#15803d"/>
    <path d="M 30,15 L 38,0 L 46,15 Z" fill="#15803d"/>
    <circle cx="55" cy="5" r="8" fill="#22c55e" opacity="0.4"/>
    <circle cx="62" cy="18" r="7" fill="#16a34a" opacity="0.4"/>
    
    <!-- Main Location Pin -->
    <g transform="translate(25, -20)" filter="url(#mapShadow)">
      <!-- Pulsing ring -->
      <circle cx="0" cy="0" r="18" fill="#166534" opacity="0.25"/>
      <!-- Pin background -->
      <path d="M 0,0 C -12,0 -16,-12 -16,-20 C -16,-32 0,-44 0,-44 C 0,-44 16,-32 16,-20 C 16,-12 12,0 0,0 Z" fill="#166534"/>
      <!-- Inner star / symbol -->
      <circle cx="0" cy="-22" r="7" fill="#ffffff"/>
      <circle cx="0" cy="-22" r="4" fill="#166534"/>
      
      <!-- Label Banner -->
      <rect x="-130" y="-85" width="260" height="38" rx="8" fill="#166534"/>
      <text x="0" y="-68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Kampeerverblijfpark Veronique</text>
      <text x="0" y="-53" font-size="11" fill="#bbf7d0" font-weight="500" text-anchor="middle">📍 Vaartstraat 8, 1910 Kampenhout</text>
    </g>
  </g>

  <!-- Direction Arrows & Surrounding Cities -->
  <!-- Mechelen (North-West) -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" filter="url(#mapShadow)"/>
    <path d="M -8,4 L -2,-4 L 4,4" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="44" font-size="12" fill="#1e293b" font-weight="700" text-anchor="middle">Mechelen</text>
    <text x="0" y="58" font-size="10" fill="#64748b" text-anchor="middle">ca. 14 km (15 min)</text>
  </g>

  <!-- Leuven (South-East) -->
  <g transform="translate(880, 460)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" filter="url(#mapShadow)"/>
    <path d="M 4,-4 L -2,4 L -8,-4" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="44" font-size="12" fill="#1e293b" font-weight="700" text-anchor="middle">Leuven</text>
    <text x="0" y="58" font-size="10" fill="#64748b" text-anchor="middle">ca. 16 km (18 min)</text>
  </g>

  <!-- Brussel (South-West) -->
  <g transform="translate(80, 460)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" filter="url(#mapShadow)"/>
    <text x="0" y="44" font-size="12" fill="#1e293b" font-weight="700" text-anchor="middle">Brussel</text>
    <text x="0" y="58" font-size="10" fill="#64748b" text-anchor="middle">ca. 22 km (25 min)</text>
  </g>

  <!-- Kampenhout Centrum indicator -->
  <g transform="translate(360, 440)">
    <rect x="-70" y="-16" width="140" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mapShadow)"/>
    <text x="0" y="5" font-size="12" fill="#334155" font-weight="700" text-anchor="middle">Kampenhout Centrum</text>
  </g>

  <!-- Sas van Kampenhout / Dijleland badge in corner -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="220" height="52" rx="8" fill="#ffffff" opacity="0.95" filter="url(#mapShadow)"/>
    <text x="14" y="22" font-size="12" fill="#166534" font-weight="700">Groene Gordel &amp; Dijleland</text>
    <text x="14" y="38" font-size="10" fill="#64748b">Vlaams-Brabant • Witloofstreek</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(910, 80)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" filter="url(#mapShadow)"/>
    <polygon points="0,-16 4,0 0,4 -4,0" fill="#166534"/>
    <polygon points="0,16 4,0 0,-4 -4,0" fill="#cbd5e1"/>
    <text x="0" y="-19" font-size="9" font-weight="bold" fill="#166534" text-anchor="middle">N</text>
  </g>
</svg>
